<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<!-- GitHub Pages cannot send response headers, so the enforceable half of the
     security policy has to travel in the document. Everything is denied by
     default; each origin below is one the page genuinely loads:

       gc.zgo.at + mystore.goatcounter.com  the analytics script and its beacon
       cdn.jsdelivr.net                     the search engine, imported on demand
       https:                               catalog images, which the owner supplies
                                            as any http(s) URL (CATALOG-GUIDE,
                                            Field reference)
       'wasm-unsafe-eval'                   sql.js and ternlight instantiate WASM

     `style-src` keeps 'unsafe-inline' because product tints are written as
     `style="background:…"` by common.js and search.js. Inline STYLE is the one
     exception; inline SCRIPT is not allowed anywhere, which is what makes this
     worth having. `frame-ancestors` is deliberately absent: it is ignored in a
     meta tag, so clickjacking cannot be fixed from here. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; object-src 'none'; script-src 'self' 'wasm-unsafe-eval' https://gc.zgo.at https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://cdn.jsdelivr.net https://mystore.goatcounter.com; media-src 'self'; frame-src 'none'; form-action 'self'; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="stylesheet" href="./styles.css?v={{version}}">
<script data-goatcounter="https://mystore.goatcounter.com/count"
        async src="https://gc.zgo.at/count.js"></script>
</head>
<body>

<header class="header">
  <div class="header__inner">
    <div class="header__tools">
      <button class="icon-link" type="button" data-menu-toggle aria-expanded="false" aria-controls="mobile-nav" aria-label="Menu">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 7h18M3 12h18M3 17h18"></path></svg>
      </button>
      <button class="icon-link" type="button" data-search-open aria-label="Search products">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M16.5 16.5L21 21"></path></svg>
      </button>
    </div>

    <a class="logo" href="./">Alex Store</a>

    <nav class="nav" id="mobile-nav" aria-label="Main">
      <button class="nav__close" type="button" data-menu-close aria-label="Close menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
{{nav}}
      <button class="nav__search" type="button" data-search-open aria-label="Search products">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M16.5 16.5L21 21"></path></svg>
      </button>
      <div class="nav__footer">
        <div class="cat">Questions?</div>
        <a class="nav__wa" data-whatsapp-general href="#" target="_blank" rel="noopener">Order on <span class="wa-word">WhatsApp</span></a>
      </div>
    </nav>
  </div>
  <div class="nav-backdrop" data-menu-close hidden></div>
</header>

<!-- search dialog -->
<div class="search" id="search-dialog" role="dialog" aria-modal="true" aria-label="Search products" hidden>
  <div class="search__panel">
    <form class="search__bar" id="search-form" role="search">
      <svg class="search__icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle><path d="M16.5 16.5L21 21"></path>
      </svg>
      <input id="search-input" type="search" autocomplete="off"
             placeholder="Search products &mdash; try &lsquo;something warm for a table&rsquo;"
             aria-label="Search products">
      <button class="search__close" type="button" data-search-close aria-label="Close search">&times;</button>
    </form>
    <p class="search__status" id="search-status" role="status" aria-live="polite"></p>
    <ul class="search__results" id="search-results"></ul>
    <p class="search__hint">Search by meaning &mdash; the engine downloads once, then is cached.</p>
  </div>
</div>

{{content}}

<!-- First-visit free-delivery voucher. Shown once per browser (voucher.js),
     and only when the catalog actually carries a voucher. Hidden by default
     so nothing flashes before the catalog loads. -->
<div class="voucher" id="voucher" role="dialog" aria-modal="true" aria-labelledby="voucher-title" hidden>
  <canvas class="voucher__confetti" data-voucher-confetti aria-hidden="true"></canvas>
  <div class="voucher__panel">
    <div class="voucher__ticket">
      <div class="voucher__kicker">Welcome offer</div>
      <h2 class="voucher__title" id="voucher-title"></h2>
      <p class="voucher__desc" id="voucher-desc"></p>
      <p class="voucher__code" id="voucher-code" hidden></p>
      <p class="voucher__terms" id="voucher-terms" hidden></p>
      <div class="voucher__actions">
        <button class="btn btn-solid" type="button" data-voucher-claim>
          <span class="btn__label">Claim voucher</span>
        </button>
        <button class="voucher__dismiss" type="button" data-voucher-dismiss>No thanks</button>
      </div>
      <p class="voucher__claimed" id="voucher-claimed" role="status" aria-live="polite" hidden>
        Voucher claimed &mdash; see you at checkout.
      </p>
    </div>
  </div>
</div>

<footer class="footer">
  <div class="footer__inner">
    <div>
      <div class="footer__title">Order on <span class="wa-word">WhatsApp</span></div>
      <div class="footer__meta">Replies within a few hours &middot; +92 328 8304524</div>
      <div class="footer__note" data-delivery-note hidden></div>
    </div>
    <div>
      <a class="btn btn-solid" data-whatsapp-general href="#" target="_blank" rel="noopener">
        <span class="btn__label">Chat on <span class="wa-word">WhatsApp</span></span>
      </a>
    </div>
  </div>
</footer>

<script src="./vendor/sql-wasm.js?v={{version}}"></script>
<script src="./db.js?v={{version}}"></script>
<script src="./common.js?v={{version}}"></script>
<script src="./voucher.js?v={{version}}"></script>
<script src="./drawer.js?v={{version}}"></script>
<script src="./sticky.js?v={{version}}"></script>
<script src="./search.js?v={{version}}"></script>
<script src="./{{page_script}}?v={{version}}"></script>
</body>
</html>
