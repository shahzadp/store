<!--
  Source for product.html. Edit this file, not the generated one in the
  repo root - `node build.mjs` regenerates that from here plus
  src/_layout.html.

  page: product
  title: Alex Store
  description: Product details from Alex Store. Order on WhatsApp.
-->
<main>
  <section class="page-head page-head--tight container">
    <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
  </section>

  <section class="shop shop--flush">
    <div class="container">
      <div id="product-view" aria-live="polite">
        <p class="catalog-status">Loading product&hellip;</p>
      </div>
    </div>
  </section>
</main>

<!-- Sticky mobile buy bar. Appears only once the page's own buy button has
     scrolled out of view (product.js), and only on small screens (CSS). -->
<div class="buybar" id="buybar" role="group" aria-label="Buy this product" hidden>
  <div class="buybar__inner">
    <span class="buybar__price" id="buybar-price"></span>
    <a class="btn btn-solid buybar__cta" id="buybar-link" href="#" target="_blank" rel="noopener">
      <span class="btn__label">Buy on <span class="wa-word">WhatsApp</span></span>
    </a>
  </div>
</div>
