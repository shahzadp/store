<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" width="1200" height="1040" role="img" aria-label="Ceramic vase with dried stems, a glass carafe, a mug and a candle on a table" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E6DCF1"/>
      <stop offset="1" stop-color="#D2C3E6"/>
    </linearGradient>
  </defs>

  <!-- Wall, light and table -->
  <rect width="600" height="360" fill="url(#wall)"/>
  <polygon points="400,0 540,0 330,360 150,360" fill="#fff" opacity=".2"/>
  <rect y="360" width="600" height="160" fill="#BFAED8"/>
  <rect y="360" width="600" height="3" fill="#A894C8"/>

  <!-- Shadows -->
  <ellipse cx="210" cy="374" rx="100" ry="10" fill="#6F5A92" opacity=".3"/>
  <ellipse cx="330" cy="356" rx="50" ry="6" fill="#6F5A92" opacity=".25"/>
  <ellipse cx="421" cy="374" rx="62" ry="9" fill="#6F5A92" opacity=".3"/>
  <ellipse cx="526" cy="374" rx="42" ry="7" fill="#6F5A92" opacity=".3"/>

  <!-- Dried stems -->
  <g stroke="#7B6590" stroke-width="2" fill="none">
    <path d="M210 190Q200 130 170 80"/>
    <path d="M210 190Q212 120 205 55"/>
    <path d="M210 190Q225 130 252 88"/>
    <path d="M210 190Q190 150 135 120"/>
  </g>
  <g fill="#EDE4F6">
    <ellipse cx="167" cy="70" rx="10" ry="26" transform="rotate(-20 167 70)"/>
    <ellipse cx="205" cy="42" rx="10" ry="28"/>
    <ellipse cx="256" cy="78" rx="10" ry="26" transform="rotate(25 256 78)"/>
  </g>
  <ellipse cx="128" cy="112" rx="9" ry="22" transform="rotate(-60 128 112)" fill="#CDBBE3"/>

  <!-- Vase -->
  <path d="M160 370C150 300 160 250 190 225L190 190H230V225C260 250 270 300 260 370Z" fill="#8E72B3"/>
  <path d="M172 340C166 295 174 262 196 240" stroke="#A78CC9" stroke-width="6" fill="none" opacity=".6"/>
  <ellipse cx="210" cy="190" rx="20" ry="5" fill="#6F5594"/>

  <!-- Carafe -->
  <path d="M298 352V292C298 272 318 262 318 238V214H342V238C342 262 362 272 362 292V352Z" fill="#F5F0FA" fill-opacity=".6" stroke="#B8A6D1" stroke-width="2"/>
  <path d="M298 312H362V352H298Z" fill="#C9B8E0" opacity=".6"/>

  <!-- Mug -->
  <rect x="385" y="305" width="72" height="65" rx="10" fill="#F4EEF9" stroke="#CBBBE0" stroke-width="2"/>
  <rect x="385" y="330" width="72" height="6" fill="#8E72B3" opacity=".5"/>
  <path d="M457 322C485 322 485 356 457 356" stroke="#CBBBE0" stroke-width="9" fill="none"/>
  <ellipse cx="421" cy="306" rx="36" ry="7" fill="#7A5C70"/>

  <!-- Candle -->
  <rect x="500" y="300" width="52" height="70" rx="4" fill="#E3D6EE" stroke="#CBBBE0" stroke-width="2"/>
  <path d="M526 300V289" stroke="#5A4A64" stroke-width="2"/>
  <circle cx="526" cy="282" r="28" fill="#F2D3A0" opacity=".2"/>
  <ellipse cx="526" cy="280" rx="5" ry="11" fill="#F2D3A0"/>

  <!-- Folded linen -->
  <rect x="40" y="400" width="210" height="80" rx="6" fill="#E8DDF2"/>
  <path d="M40 424H250M40 448H250" stroke="#D3C4E6" stroke-width="3"/>
</svg>
